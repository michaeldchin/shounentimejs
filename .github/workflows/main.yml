name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          set -e
          cd /home/debian/src/shounentimejs || git clone git@github.com:michaeldchin/shounentimejs.git /home/debian/src/shounentimejs
          cd /home/debian/src/shounentimejs
          git pull origin master
          npm ci --production
          sudo systemctl restart shounentime
          sudo systemctl restart shounen-backend

  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shounen-frontend/package-lock.json

      - name: Install dependencies
        working-directory: shounen-frontend
        run: npm ci

      - name: Build frontend
        working-directory: shounen-frontend
        run: npm run build

      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "shounen-frontend/dist/shounen-frontend"
          target: "/home/debian/src/shounentimejs/shounen-frontend/dist/shounen-frontend"
          strip_components: 3
